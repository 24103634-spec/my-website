<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Gallery</title>
<style>
    .skip-link {
        position: absolute;
        left: -9999px;
    }

    .skip-link:focus {
        position: static;
        background-color: yellow;
        color: black;
        padding: 10px;
    }

    nav {
        display: flex;
        gap: 20px;
        background-color: #333;
        padding: 15px;
    }

    nav a {
        color: white;
        text-decoration: none;
        padding: 8px 15px;
    }

    nav a:hover {
        transform: scale(1.1);
        text-decoration: underline;
    }

    main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    img {
        width: 100%;
        border: 3px solid black;
        padding: 5px;
        border-radius: 15px;
    }
</style>
</head>

    </nav>

</html>
